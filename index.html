<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stop! — o jogo das letras</title>
<meta name="theme-color" content="#c8102e">
<meta name="description" content="Stop! (Adedonha) para jogar com os amigos, cada um no seu telemóvel.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Caveat+Brush&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbf5e6;--paper2:#f4ebd3;--ink:#1c1915;--muted:#7a7064;--line:#e6d9bc;--red:#c8102e;--yellow:#f5b700;--green:#1f8a4c;--white:#fffdf7;--radius:16px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:16px;line-height:1.4;min-height:100vh;
  background-image:repeating-linear-gradient(transparent 0 31px,rgba(30,60,140,.06) 31px 32px)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font:inherit;color:inherit}
.hand{font-family:"Caveat Brush",cursive;font-weight:400}
#app{max-width:560px;margin:0 auto;padding:16px 16px 130px}
header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:26px;letter-spacing:-.5px}
.oct{width:38px;height:38px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;letter-spacing:.5px;flex-shrink:0;
  clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.logo small{display:block;font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0;margin-top:-4px}
.codetag{font-weight:800;letter-spacing:2px;font-size:14px;background:var(--ink);color:var(--paper);padding:6px 10px;border-radius:8px}
.ghost{padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--white);font-size:14px;font-weight:600}
.card{background:var(--white);border:1.5px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 2px 0 var(--line)}
h2{font-size:18px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.hint{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px}
.field{flex:1;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);outline:none;min-width:0}
.field:focus{border-color:var(--ink)}
.field.code{text-transform:uppercase;letter-spacing:4px;font-weight:800;text-align:center;font-size:20px}
.btn{padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--paper);font-weight:700;white-space:nowrap}
.btn.red{background:var(--red);color:#fff}.btn.yellow{background:var(--yellow);color:var(--ink)}
.btn.line{background:var(--white);color:var(--ink);border:1.5px solid var(--ink)}
.btn.big{width:100%;padding:16px;font-size:18px;border-radius:14px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--paper2);font-weight:600;font-size:15px}
.chip.x{padding-right:8px}
.chip button{width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.08);font-size:14px;line-height:1}
.chip.add{background:transparent;border:1.5px dashed var(--line);color:var(--muted);padding:6px 12px}
.chip.me{background:var(--yellow)}
.chip.off{opacity:.45}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1;min-width:60px;padding:10px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:14px}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.sw{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex-shrink:0;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--green)}.sw.on::after{left:23px}
details.rules summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between}
details.rules summary::after{content:"+";font-size:20px;line-height:1}
details.rules[open] summary::after{content:"–"}
details.rules ul{margin:10px 0 0 18px;color:#3d372f;font-size:15px}
details.rules li{margin-bottom:6px}
.games{list-style:none}
.games li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.games li:first-child{border-top:none}
.games .gn{flex:1;min-width:0}.games .gn b{display:block}
.center{text-align:center}
.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:700;color:var(--muted)}
.who{font-size:24px;font-weight:800;margin:4px 0 16px}
.who em{font-style:normal;background:var(--yellow);padding:0 6px;border-radius:6px}
.bigcode{font-size:52px;font-weight:800;letter-spacing:8px;margin:4px 0 2px}
.bigletter{font-family:"Caveat Brush",cursive;font-size:150px;line-height:1;width:200px;height:200px;margin:0 auto 18px;display:grid;place-items:center;
  background:var(--white);border:3px solid var(--ink);border-radius:28px;box-shadow:6px 6px 0 var(--ink);transform:rotate(-2deg)}
.bigletter.q{color:var(--line)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.grid button{aspect-ratio:1;border-radius:10px;background:var(--white);border:1.5px solid var(--line);font-weight:800;font-size:18px}
.grid button.used{text-decoration:line-through;color:var(--muted);background:var(--paper2);opacity:.6}
.grid button.off{opacity:.25}
.wait{font-size:40px;animation:bob 1.2s ease-in-out infinite alternate;display:inline-block;margin:20px 0 6px}
@keyframes bob{to{transform:translateY(-8px)}}
.timer{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.timer.urgent{color:var(--red);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.tbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:12px}
.tbar i{display:block;height:100%;background:var(--green);transition:width 1s linear}
.tbar.urgent i{background:var(--red)}
.typebar{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 0 12px;margin:-16px 0 10px;border-bottom:1.5px solid var(--line);display:flex;align-items:center;gap:12px}
.lbadge{font-family:"Caveat Brush",cursive;font-size:44px;line-height:1;width:58px;height:58px;display:grid;place-items:center;background:var(--white);border:2.5px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);flex-shrink:0}
.typebar .meta{flex:1;min-width:0}
.typebar .meta b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#progress{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
#progress span{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--white);border:1.5px solid var(--line)}
#progress span.full{border-color:var(--red);color:var(--red)}
.ans{display:block;margin-bottom:12px}
.ans span{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
.ans input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--white);outline:none;font-size:20px;font-family:"Caveat Brush",cursive}
.ans input:focus{border-color:var(--ink)}
.ans input.bad{border-color:var(--red);background:#fff4f4}
.ans input:disabled{background:var(--paper2);color:var(--muted)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper) 30%);z-index:6}
.dock .inner{max-width:528px;margin:0 auto;display:flex;gap:8px}
.dock .note{max-width:528px;margin:0 auto 6px;text-align:center;font-size:13px;color:var(--muted)}
.catblock h3{font-size:15px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:8px}
.arow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0;border-top:1px dashed var(--line)}
.arow:first-of-type{border-top:none}
.arow .pn{font-size:13px;color:var(--muted);width:82px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .aw{flex:1;font-family:"Caveat Brush",cursive;font-size:22px;line-height:1.1;min-width:0;word-break:break-word}
.arow .aw.empty{color:var(--line)}
.arow.x .atxt{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px;color:var(--muted)}
.arow:disabled{cursor:default}
.arow.voted{background:#fff1f1;border-radius:10px;padding-left:6px;padding-right:6px}
.vd{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:12px;font-weight:600;color:var(--muted);margin-top:3px;text-decoration:none}
.arow.x .vd{text-decoration:none}
.vd.bad{color:var(--red)}.vd.good{color:var(--green)}
.vbtn{font-size:11px;font-weight:700;color:var(--muted);border:1.5px solid var(--line);border-radius:999px;padding:3px 8px;white-space:nowrap}
.arow.voted .vbtn{border-color:var(--red);color:var(--red)}
.judge{display:flex;gap:12px;align-items:center}
.judge .jico{font-size:28px}
.judge.ok{border-color:#bfe3cc;background:#f3fbf6}
.judge.off{border-color:var(--yellow);background:#fffaeb}
.pts{min-width:42px;text-align:center;padding:4px 8px;border-radius:999px;font-weight:800;font-size:14px}
.pts.p10{background:var(--green);color:#fff}.pts.p5{background:var(--yellow)}.pts.p0{background:var(--paper2);color:var(--muted)}
.lb{list-style:none}
.lb li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px dashed var(--line)}
.lb li:first-child{border-top:none}
.lb .pos{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--paper2)}
.lb li:first-child .pos{background:var(--yellow)}
.lb .nm{flex:1;font-weight:700;font-size:18px}
.lb .plus{color:var(--green);font-weight:700;font-size:14px}
.lb .sc{font-size:24px;font-weight:800;min-width:56px;text-align:right}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist th,.hist td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
.hist th:first-child,.hist td:first-child{text-align:left}
.hist td.l{font-family:"Caveat Brush",cursive;font-size:22px}
.tablewrap{overflow-x:auto}
.trophy{font-size:80px;margin-top:10px}
.winner{font-size:36px;font-weight:800;margin:4px 0}.winner em{font-style:normal;color:var(--red)}
#overlay{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(28,25,21,.85);padding:20px}
#overlay.show{display:grid}
.count{font-family:"Caveat Brush",cursive;font-size:200px;color:var(--yellow);animation:pop .9s ease-out}
.flashwrap{text-align:center;color:#fff}
.flash{background:var(--red);color:#fff;font-weight:800;font-size:72px;width:260px;height:260px;display:grid;place-items:center;margin:0 auto 18px;
  clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);box-shadow:inset 0 0 0 10px #fff,inset 0 0 0 15px var(--red);animation:pop .5s ease-out}
.flashwrap p{font-size:22px;font-weight:700}
@keyframes pop{from{transform:scale(.3);opacity:0}60%{transform:scale(1.1);opacity:1}to{transform:scale(1)}}
.modal{background:var(--white);border-radius:20px;padding:22px;max-width:340px;width:100%;text-align:center;animation:pop .25s ease-out}
.modal p{margin:6px 0 18px;color:#3d372f}
.modal .row{flex-direction:column}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;display:none;max-width:90vw;text-align:center}
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:rot 0.8s linear infinite;margin:30px auto 10px}
@keyframes rot{to{transform:rotate(360deg)}}
@media (max-width:380px){.bigletter{width:170px;height:170px;font-size:120px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<div id="toast"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/claude-shim.js"></script>
<script>
(function(){
/* ================= constants & helpers ================= */
const DEFAULT_CATS=['Nome','País','Fruto','Objecto','Cor','Animal','Celebridade'];
const SUGGEST=['Cidade','Profissão','Comida','Marca','Filme / Novela','Cantor','Desporto','Parte do corpo','Bairro','Planta','Carro'];
const LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const HARD=['K','W','Y','X'];
const MAXP=10, MAXC=10, ANSLEN=22;
const LEVELS=[['facil','Fácil','Ignora acentos e aceita 1 ou 2 letras erradas.'],['medio','Médio','Ignora acentos, mas a palavra tem de estar bem escrita.'],['dificil','Difícil','Ortografia exacta, acentos incluídos.']];
const lvName=v=>(LEVELS.find(l=>l[0]===v)||LEVELS[1])[1];
const app=document.getElementById('app'), ov=document.getElementById('overlay');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const clean=(s,n)=>String(s==null?'':s).replace(/[\u0000-\u001f\u007f-\u009f\u00ad\u200b-\u200f\u2028-\u202e\u2060-\u206f\ufeff]/g,'').replace(/\s+/g,' ').trim().slice(0,n);
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const fmt=s=>Math.floor(s/60)+':'+String(Math.max(0,s)%60).padStart(2,'0');
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3000)}
let actx=null;
function beep(f,d,delay){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=f;o.connect(g);g.connect(actx.destination);const t=actx.currentTime+(delay||0);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
function overlay(html,ms,cb){ov.innerHTML=html;ov.classList.add('show');clearTimeout(overlay.t);if(ms)overlay.t=setTimeout(()=>{closeOverlay();cb&&cb()},ms)}
function closeOverlay(){ov.classList.remove('show');ov.innerHTML=''}
function confirmBox(title,text,ok,onOk){
  overlay(`<div class="modal"><h2 style="justify-content:center">${title}</h2><p>${text}</p><div class="row"><button class="btn red big" id="mok">${ok}</button><button class="btn line big" id="mno">Cancelar</button></div></div>`);
  document.getElementById('mok').onclick=()=>{closeOverlay();onOk()};document.getElementById('mno').onclick=closeOverlay;
}
function confetti(){const c=['#c8102e','#f5b700','#1c1915','#1f8a4c'];for(let i=0;i<60;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=c[i%4];d.style.animationDuration=(2+Math.random()*2.5)+'s';d.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),5500)}}

/* ================= state ================= */
let room;            // undefined = connecting, null = unavailable
let lobbyPeers=[], roomPeers=[];
let myName=lsGet('stop-name')||'';
let myPeer=null;
let R=null, code=null, isHost=false, G=null, hostPeer=null, lastRawG=null, hostGone=false, joinedAt=0;
let myAns=[], myRound=0, locked=false, typingLive=false;
let tLocal=null, tLeft=0, hostTimer=null, collectTimer=null, pushTimer=null, cdTimer=null;
let lastKey='', joinErr='';
let sampleFn, judgeWarm=false, myVotes=new Set(), votesFor=0;
let autoTimer=null, autoKey='', autoAt=0, migTimer=null, quickBusy=false, quickTries=0;
const PUB_MAX=8;
const hostName=()=>esc((G.ro[G.h]||G.ro[0]||{}).n||'o anfitrião');

/* ================= game logic (shared) ================= */
function available(g){return LETTERS.filter(l=>(g.hard||!HARD.includes(l))&&!g.used.includes(l))}
function myIdx(){return G?G.ro.findIndex(r=>r.p===myPeer):-1}
function totals(g){const t=g.ro.map(()=>0);g.hist.forEach(h=>h.s.forEach((v,i)=>{if(i<t.length)t[i]+=(+v||0)}));return t}
function isOver(g){return (g.mr&&g.hist.length>=g.mr)||available(g).length===0}
function presentIdx(g){const s=presentSet();return g.ro.map((r,i)=>i).filter(i=>g.ro[i].p===myPeer||s.has(g.ro[i].p))}
function votesMap(g){
  const m={};if(!g||g.ph!=='review')return m;
  const ps=R?R.peers():roomPeers;
  g.ro.forEach((r,v)=>{
    let ks=null;
    if(r.p===myPeer)ks=[...myVotes];
    else{const p=ps.find(x=>x.peer===r.p),vt=p&&p.presence&&p.presence.vt;if(vt&&vt.n===g.n&&Array.isArray(vt.k))ks=vt.k.slice(0,200)}
    (ks||[]).forEach(k=>{if(typeof k!=='string'||!/^\d+\.\d+$/.test(k))return;const a=+k.split('.')[0];if(a===v||a>=g.ro.length)return;(m[k]=m[k]||new Set()).add(v)});
  });
  return m;
}
function score(g,vm){
  vm=vm||{};
  const L=norm(g.L),res=g.ro.map(()=>[]),pres=presentIdx(g),jOn=g.js==='done';
  g.cats.forEach((c,ci)=>{
    const valid=g.ro.map((_,i)=>{
      const raw=((g.res||[])[i]||[])[ci]||'',a=norm(raw),k=i+'.'+ci;
      const letter=!!a&&a.startsWith(L)&&a.replace(/[^a-z0-9]/g,'').length>1;
      const j=jOn&&g.jz&&g.jz[i]?(g.jz[i][ci]||'?'):'?';
      let ok=letter&&j!=='0';
      const votes=vm[k]?vm[k].size:0, elig=pres.filter(x=>x!==i).length;
      const need=jOn?Math.max(2,Math.floor(elig/2)+1):Math.max(1,Math.floor(elig/2)+1);
      const flipped=letter&&elig>0&&votes>=need;
      if(flipped)ok=!ok;
      res[i][ci]={raw,letter,j,ok,votes,need,flipped,reason:(g.jr||{})[k]||'',pts:0};
      return ok?a:null;
    });
    const cnt={};valid.forEach(v=>{if(v)cnt[v]=(cnt[v]||0)+1});
    valid.forEach((v,i)=>res[i][ci].pts=v?(cnt[v]>1?5:10):0);
  });
  return res;
}
function sanitizeGame(g){
  if(!g||typeof g!=='object'||!Array.isArray(g.ro)||!Array.isArray(g.cats))return null;
  const ph=['lobby','pick','play','stop','review','scores','final'].includes(g.ph)?g.ph:'lobby';
  const ro=g.ro.slice(0,MAXP).map(r=>({p:String(r&&r.p||''),n:clean(r&&r.n,18)||'Jogador'}));
  const cats=g.cats.slice(0,MAXC).map(c=>clean(c,20)).filter(Boolean);
  const L=LETTERS.includes(g.L)?g.L:null;
  const h=Number.isInteger(+g.h)&&+g.h>=0&&+g.h<ro.length?+g.h:0;
  const au=g.au&&typeof g.au==='object'?{k:clean(g.au.k,20),ms:Math.max(0,Math.min(120000,+g.au.ms||0))}:null;
  const jr={};if(g.jr&&typeof g.jr==='object')Object.keys(g.jr).slice(0,120).forEach(k=>{if(/^\d+\.\d+$/.test(k))jr[k]=clean(g.jr[k],40)});
  return {code:clean(g.code,8),ph,h,pub:!!g.pub,au,n:+g.n||0,pk:+g.pk||0,L,cats,t:+g.t||0,mr:+g.mr||0,hard:!!g.hard,judge:!!g.judge,lv:LEVELS.some(l=>l[0]===g.lv)?g.lv:'medio',
    used:String(g.used||'').replace(/[^A-Z]/g,''),ro,

  if(!key){clearTimeout(autoTimer);autoKey='';autoAt=0;G.au=null;return}
  const at=Date.now()+delay;
  if(key!==autoKey){autoKey=key;autoAt=at}else if(key==='lobby'&&at<autoAt)autoAt=at;

    if(G.ro.some(r=>r.p===p.peer))return;

    if(old>=0){G.ro[old].p=p.peer;changed=true;return}

async function runJudge(n){

  <div class="card"><h2>🔒 Sala privada</h2>

  <div class="card"><details class="rules"><summary>Como se joga</summary><ul>
    <li>Uma pessoa cria o jogo e os outros entram, cada um no seu telemóvel.</li>
    <li>Em cada ronda um jogador escolhe a letra (ou sorteia). Todos preenchem as colunas com palavras começadas por essa letra.</li>
    <li>Quem preencher tudo primeiro carrega no <b>STOP</b> e a escrita pára em todos os telemóveis.</li>
    <li><b>10 pontos</b> para uma resposta que mais ninguém deu, <b>5</b> se outro escreveu a mesma, <b>0</b> em branco ou inválida. Os acentos não contam.</li>
    <li>⚖️ No fim de cada ronda o <b>juiz</b> confirma as respostas no dicionário e nas listas (países, cores, animais, frutos, nomes, cidades): inventadas, fora da categoria ou mal escritas valem 0.</li>
    <li>🎯 Há 3 níveis: no <b>Fácil</b> aceitam-se acentos em falta e pequenos erros; no <b>Médio</b> só os acentos em falta; no <b>Difícil</b> nenhum erro.</li>
    <li>🗳️ Se discordarem do juiz, os outros jogadores podem votar para mudar a decisão (ninguém vota nas próprias respostas).</li>
  </ul></details></div>
  `;
  return {key,html};
}

function vReview(){
  const vm=votesMap(G),sc=score(G,vm),mi=myIdx();
  const vkey=Object.keys(vm).sort().map(k=>k+':'+[...vm[k]].sort().join('-')).join(',');
  const key=JSON.stringify(['review',G,isHost,myPeer,vkey,presentIdx(G).join()]);
  const t=sc.map(r=>r.reduce((a,x)=>a+x.pts,0));
  const elig=Math.max(0,presentIdx(G).length-1);
  const need=G.js==='done'?Math.max(2,Math.floor(elig/2)+1):Math.max(1,Math.floor(elig/2)+1);
  let banner='';
  if(G.js==='busy')banner=`<div class="card judge"><div class="spin" style="margin:0"></div><div><b>⚖️ O juiz está a verificar as respostas…</b><div class="hint">Demora alguns segundos.</div></div></div>`;
  else if(G.js==='done')banner=`<div class="card judge ok"><div class="jico">⚖️</div><div><b>O juiz já avaliou (nível ${lvName(G.lv)}).</b><div class="hint">${elig>=2?`Discordas? Toca numa resposta de outro jogador para a contestar. São precisos ${need} votos para mudar a decisão.`:'Com 2 jogadores, a decisão do juiz é final.'}</div></div></div>`;
  else banner=`<div class="card judge off"><div class="jico">🗳️</div><div><b>Sem juiz nesta ronda.</b><div class="hint">A app só confirma a letra. Toca nas respostas de outros jogadores que achas inválidas: com ${need} voto${need>1?'s':''} a resposta é anulada.</div></div></div>`;
  const busy=G.js==='busy';
  const html=gameTop()+`<div class="center" style="margin-bottom:14px"><div class="eyebrow">Correcção · Ronda ${G.hist.length+1}</div><div class="who" style="margin:4px 0 0">Letra <span class="hand" style="font-size:40px">${G.L}</span></div>
    <p class="hint">${G.sb===-1?'Acabou o tempo.':G.sb!=null&&G.ro[G.sb]?esc(G.ro[G.sb].n)+' carregou no STOP.':''}</p></div>`+banner+
  G.cats.map((c,ci)=>`<div class="card catblock"><h3>${esc(c)}</h3>${G.ro.map((r,i)=>{
    const x=sc[i][ci],k=i+'.'+ci,mine=myVotes.has(k);
    let vd='',cls='';
    if(x.raw){
      if(!x.letter){vd='Não começa por '+G.L;cls='bad'}
      else if(x.flipped){vd=x.ok?'🗳️ Validada pelos jogadores':'🗳️ Anulada pelos jogadores';cls=x.ok?'good':'bad'}
      else if(x.j==='0'){vd='⚖️ '+esc(x.reason||'Inválida');cls='bad'}
      else if(x.j==='1'){vd='⚖️ Válida';cls='good'}
      if(x.votes&&x.letter&&!x.flipped)vd+=(vd?' · ':'')+'👎 '+x.votes+'/'+x.need;
    }
    const can=!busy&&mi>=0&&i!==mi&&x.raw&&x.letter;
    return `<button class="arow ${x.raw&&!x.ok?'x':''} ${mine?'voted':''}" data-a="vote" data-p="${i}" data-c="${ci}" ${can?'':'disabled'}><span class="pn">${esc(r.n)}${i===mi?' (tu)':''}</span><span class="aw ${x.raw?'':'empty'}">${x.raw?'<span class="atxt">'+esc(x.raw)+'</span>':'— em branco —'}${vd?`<span class="vd ${cls}">${vd}</span>`:''}</span>${can?`<span class="vbtn">${mine?'✓ contestada':'contestar'}</span>`:''}<span class="pts p${busy?0:x.pts}">${busy&&x.raw?'…':x.pts}</span></button>`}).join('')}</div>`).join('')+
  `<div class="card"><h2>Pontos desta ronda</h2><ul class="lb">${G.ro.map((r,i)=>`<li><span class="nm">${esc(r.n)}</span><span class="sc">${busy?'…':t[i]}</span></li>`).join('')}</ul></div>`+
  (isHost?`<div class="dock"><div class="note">${busy?'À espera do juiz…':G.pub&&G.au?'Confirmação automática em <b data-auto></b> s.':'Quando todos tiverem votado, confirma.'}</div><div class="inner"><button class="btn red big" data-a="confirm" ${busy?'disabled':''}>Confirmar pontos</button></div></div>`:`<div class="dock"><div class="note">${G.pub&&G.au?'Pontos confirmados em <b data-auto></b> s…':'À espera que '+hostName()+' confirme os pontos…'}</div></div>`);
  return {key,html};
}
function vStopping(){return {key:'stopping'+G.n,html:gameTop()+`<div class="center"><div class="spin"></div><p class="hint">A recolher as respostas de todos…</p></div>`}}

function leaderboard(plus){
  const t=totals(G),last=G.hist[G.hist.length-1];
  const order=G.ro.map((r,i)=>i).sort((a,b)=>t[b]-t[a]);
  return `<ul class="lb">${order.map((i,k)=>`<li><span class="pos">${k+1}</span><span class="nm">${esc(G.ro[i].n)}${G.ro[i].p===myPeer?' (tu)':''}</span>${plus&&last?`<span class="plus">+${last.s[i]||0}</span>`:''}<span class="sc">${t[i]}</span></li>`).join('')}</ul>`;
}
function historyTable(){
  if(!G.hist.length)return '';
  return `<div class="card"><h2>Rondas</h2><div class="tablewrap"><table class="hist"><tr><th>Letra</th>${G.ro.map(r=>`<th>${esc(r.n)}</th>`).join('')}</tr>
  ${G.hist.map(h=>`<tr><td class="l">${esc(h.L)}</td>${G.ro.map((_,i)=>`<td>${h.s[i]||0}</td>`).join('')}</tr>`).join('')}</table></div></div>`;

function vFinal(){

function vWaitHost(){
  const late=Date.now()-joinedAt>6000;
  const key='wait'+hostGone+late;
  if(!late&&!hostGone)setTimeout(()=>{lastKey='';render()},6500);
  return {key,html:gameTop()+`<div class="center">${hostGone?`<div class="spin"></div><h2 style="justify-content:center">Quem dirigia o jogo saiu</h2><p class="hint">Outro jogador vai passar a dirigir o jogo. Só um momento…</p>`
   :late?`<div class="wait">🔍</div><h2 style="justify-content:center">Jogo não encontrado</h2><p class="hint">Confirma o código ${esc(code.toUpperCase())} com quem criou o jogo.</p>`
   :`<div class="spin"></div><p class="hint">A entrar no jogo ${esc(code.toUpperCase())}…</p>`}
   <button class="btn line" style="margin-top:20px" data-a="leave">Voltar</button></div>`};
}

function view(){
  if(room===undefined)return vConnecting();
  if(room===null)return vNoRoom();
  if(!R)return vHome();
  if(!G||hostGone)return vWaitHost();
  switch(G.ph){
    case 'lobby':return vLobby();
    case 'pick':return vPick();
    case 'play':return vPlay();
    case 'stop':return (myIdx()>=0&&myRound===G.n)?vPlay():vStopping();
    case 'review':return vReview();
    case 'scores':return vScores();
    case 'final':return vFinal();
  }
  return vLobby();
}
function render(){
  const v=view();
  if(v.key===lastKey)return;
  lastKey=v.key;
  const ae=document.activeElement,fa=ae&&ae.dataset&&ae.dataset.ans,fid=ae&&ae.id,sel=ae&&ae.selectionStart;
  const y=window.scrollY;
  app.innerHTML=v.html;
  if(v.after)v.after();
  let el=null;if(fa!==undefined)el=app.querySelector(`[data-ans="${fa}"]`);else if(fid)el=document.getElementById(fid);
  if(el&&!el.disabled){el.focus();try{if(sel!=null)el.setSelectionRange(sel,sel)}catch(e){}}
  window.scrollTo(0,y);
}

/* ================= actions ================= */
function needName(){const el=document.getElementById('myname');if(el){myName=clean(el.value,18);lsSet('stop-name',myName)}if(!myName){toast('Escreve primeiro o teu nome.');el&&el.focus();return false}return true}
function setG(fn){if(!isHost||!G)return;fn();publishGame()}
const A={
  host:()=>{if(!needName())return;joinGame(newCode(),true)},
  quick:async retry=>{
    if(!needName()||quickBusy)return;
    if(!window.stopServer){toast('As salas públicas não estão disponíveis aqui.');return}
    quickTries=retry===true?quickTries+1:0;quickBusy=true;lastKey='';render();
    try{const r=await window.stopServer.quick();quickBusy=false;await joinGame(r.code,!!r.host,null,true)}
    catch(e){quickBusy=false;toast('Não foi possível encontrar uma sala ('+(e&&e.code||'erro')+').')}
    lastKey='';render();
  },
  requeue:()=>{leaveGame();A.quick()},
  join:d=>{if(!needName())return;joinGame(d.v,false)},
  joinCode:()=>{if(!needName())return;joinGame(document.getElementById('jcode').value,false)},
  resume:()=>{if(!needName())return;let s=null;try{s=JSON.parse(lsGet('stop-host'))}catch(e){}const g=s&&sanitizeGame(s.G);if(!g){toast('Não foi possível recuperar o jogo.');return}joinGame(g.code,true,g)},
  leave:()=>leaveGame(),
  quit:()=>confirmBox('Sair do jogo?',isHost&&G&&G.ro.length>1?'Estás a dirigir o jogo: se saíres, outro jogador passa a dirigir.':'Podes voltar a entrar com o mesmo código e o mesmo nome.','Sim, sair',leaveGame),
  addCat:()=>{const el=document.getElementById('cname');const v=clean(el.value,20);if(!v)return;if(G.cats.some(c=>norm(c)===norm(v))){toast('Essa coluna já existe.');return}if(G.cats.length>=MAXC){toast('Máximo de '+MAXC+' colunas.');return}setG(()=>G.cats.push(v));setTimeout(()=>{const c=document.getElementById('cname');c&&c.focus()},0)},
  rmCat:d=>setG(()=>G.cats.splice(+d.i,1)),
  sugCat:d=>{if(G.cats.length>=MAXC){toast('Máximo de '+MAXC+' colunas.');return}setG(()=>G.cats.push(d.v))},
  setT:d=>setG(()=>G.t=+d.v),
  setR:d=>setG(()=>G.mr=+d.v),
  toggleHard:()=>setG(()=>G.hard=!G.hard),
  setLv:d=>{if(LEVELS.some(l=>l[0]===d.v))setG(()=>G.lv=d.v)},
  toggleJudge:()=>{if(sampleFn===null)return;setG(()=>G.judge=!G.judge)},
  start:()=>{if(isHost)hostStart()},
  pick:d=>doPick(d.v),
  spin:()=>{
    const av=available(G);if(!av.length)return;
    const box=document.getElementById('spinbox');document.getElementById('spinbtn').disabled=true;app.querySelectorAll('.grid button').forEach(b=>b.disabled=true);
    box.classList.remove('q');let k=0;const n=G.n;
    const iv=setInterval(()=>{box.textContent=av[Math.floor(Math.random()*av.length)];if(++k%2)beep(400+k*15,.03)},70);
    setTimeout(()=>{clearInterval(iv);const l=av[Math.floor(Math.random()*av.length)];box.textContent=l;beep(988,.2);setTimeout(()=>{if(G&&G.n===n&&G.ph==='pick')doPick(l)},500)},1400);
  },
  spinFor:()=>{if(!isHost)return;const av=available(G);if(av.length)startPlay(av[Math.floor(Math.random()*av.length)])},
  stop:()=>{
    if(!G||G.ph!=='play'||locked||!allFilled())return;
    const n=G.n,mi=myIdx();
    pushMe({ans:myAns.map(a=>clean(a,ANSLEN)),an:n,f:filled(),stop:n});
    lockAndFlush(mi);
    if(isHost)hostStop(mi);
  },
  vote:d=>{
    if(!G||G.ph!=='review'||G.js==='busy')return;const i=+d.p,mi=myIdx();if(i===mi||mi<0)return;
    const k=i+'.'+(+d.c);if(myVotes.has(k))myVotes.delete(k);else myVotes.add(k);
    pushMe({vt:{n:G.n,k:[...myVotes]}});lastKey='';render();
  },
  confirm:()=>{if(isHost)hostConfirm()},
  next:()=>{if(isHost)hostNext()},
  final:()=>setG(()=>G.ph='final'),
  again:()=>setG(()=>{G.hist=[];G.used='';G.ph='lobby';G.L=null})
};
function doPick(L){
  if(!G||G.ph!=='pick')return;
  if(!available(G).includes(L))return;
  if(isHost)startPlay(L);else{pushMe({pick:{n:G.n,L}});toast('Letra '+L+' escolhida!')}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;e.preventDefault();const f=A[b.dataset.a];f&&f(b.dataset,b)});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;const t=e.target;
  if(t.id==='cname'){e.preventDefault();A.addCat()}
  else if(t.id==='jcode'){e.preventDefault();A.joinCode()}
  else if(t.id==='myname'){e.preventDefault();t.blur()}
  else if(t.dataset&&t.dataset.ans!==undefined){e.preventDefault();const n=app.querySelector(`[data-ans="${+t.dataset.ans+1}"]`);if(n)n.focus();else if(allFilled())A.stop();else t.blur()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='myname'){myName=clean(t.value,18);lsSet('stop-name',myName);if(R)pushMe({name:myName});return}
  const i=t.dataset&&t.dataset.ans;if(i===undefined||!G||locked)return;
  myAns[+i]=t.value;
  const v=norm(t.value);t.classList.toggle('bad',!!v&&!v.startsWith(norm(G.L)));
  const sb=document.getElementById('stopbtn');if(sb)sb.disabled=!allFilled()||locked||!typingLive;
  paintProgress();
  clearTimeout(pushTimer);pushTimer=setTimeout(()=>pushMe({ans:myAns.map(a=>clean(a,ANSLEN)),an:myRound,f:filled()}),500);
});

// contagens automáticas das salas públicas
setInterval(()=>{const s=Math.max(0,Math.ceil((autoAt-Date.now())/1000));document.querySelectorAll('[data-auto]').forEach(el=>{if(el.textContent!==String(s))el.textContent=s})},250);
render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('/sw.js').catch(()=>{});
})();
</script>
</body>
